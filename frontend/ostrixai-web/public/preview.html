<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>OstrixAi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap">
<style>
/* Layout: landing de una columna con formas geométricas; app con barra lateral (escritorio) y barra inferior (móvil). */
:root{
  --bg:#F8FAFC;--surface:#FFFFFF;--fg:#202124;--fg2:#5F6368;--line:#E8EAED;
  --blue:#4285F4;--red:#EA4335;--yellow:#FBBC05;--green:#34A853;
  --blue-ink:#1A73E8;--on-blue:#FFFFFF;
  --blue-l:#E8F0FE;--green-l:#E6F4EA;--yellow-l:#FEF7E0;--red-l:#FCE8E6;
  --red-ink:#C5221F;--green-ink:#137333;--yellow-ink:#7A5900;
  --shadow:0 1px 2px rgba(32,33,36,.06),0 4px 14px rgba(32,33,36,.06);
  --font-text:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-head:'Lexend','Inter',system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1318;--surface:#171C22;--fg:#E8EAED;--fg2:#A9B0B8;--line:#2B323A;
  --blue-ink:#8AB4F8;--on-blue:#0B1B33;
  --blue-l:#1B2B45;--green-l:#14301F;--yellow-l:#3A3014;--red-l:#3B1A18;
  --red-ink:#F28B82;--green-ink:#81C995;--yellow-ink:#FDD663;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1318;--surface:#171C22;--fg:#E8EAED;--fg2:#A9B0B8;--line:#2B323A;
  --blue-ink:#8AB4F8;--on-blue:#0B1B33;
  --blue-l:#1B2B45;--green-l:#14301F;--yellow-l:#3A3014;--red-l:#3B1A18;
  --red-ink:#F28B82;--green-ink:#81C995;--yellow-ink:#FDD663;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.55 var(--font-text);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-head);line-height:1.2;margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue-ink);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none;color:var(--fg);transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
.btn:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--blue-ink);border-color:var(--blue-ink);color:var(--on-blue)}
.btn.danger{color:var(--red-ink);border-color:var(--red-ink)}
.btn.small{min-height:36px;padding:0 14px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

/* chips / badges */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--blue-l);color:var(--blue-ink)}
.chip.red{background:var(--red-l);color:var(--red-ink)}
.chip.green{background:var(--green-l);color:var(--green-ink)}
.chip.yellow{background:var(--yellow-l);color:var(--yellow-ink)}
.chip.gray{background:var(--line);color:var(--fg2)}
.demo-tag{font-size:12px;font-weight:600;color:var(--yellow-ink);background:var(--yellow-l);padding:4px 10px;border-radius:999px}

/* tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--fg2)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}

/* formularios */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input[type=text],input[type=password],input[type=search],input[type=date],select,textarea{min-height:44px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue-ink)}
.err{color:var(--red-ink);font-size:13px;font-weight:500;min-height:18px}

/* landing */
.pub{position:relative;min-height:100vh;overflow:hidden}
.shape{position:absolute;pointer-events:none;opacity:.14}
.s1{width:340px;height:340px;border-radius:50%;background:var(--blue);top:-120px;right:-80px}
.s2{width:180px;height:180px;border-radius:40px;background:var(--yellow);top:420px;left:-70px;transform:rotate(18deg)}
.s3{width:120px;height:120px;border-radius:50%;background:var(--red);bottom:260px;right:6%}
.s4{width:220px;height:220px;border-radius:50% 50% 50% 8px;background:var(--green);bottom:-80px;left:12%}
.wrap{position:relative;max-width:1080px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.pubnav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font:700 20px var(--font-head);color:var(--fg);text-decoration:none}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center;padding-block:32px 40px}
.hero h1{font-size:clamp(34px,6vw,56px);letter-spacing:-.02em}
.hero h1 span{color:var(--blue-ink)}
.hero p.lead{font-size:18px;color:var(--fg2);margin:16px 0 24px;max-width:48ch}
.owl-float{animation:float 5s ease-in-out infinite;display:block;margin:auto;max-width:100%}
@keyframes float{50%{transform:translateY(-8px)}}
.cap{display:flex;flex-direction:column;gap:10px}
.cap .badge{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.offline-note{display:flex;gap:10px;align-items:center;background:var(--green-l);color:var(--green-ink);padding:12px 16px;border-radius:14px;font-weight:600;margin-block:8px 28px}
.auth{max-width:440px;margin:0 auto;padding-block:24px 48px}
.notice{padding:12px 14px;border-radius:12px;background:var(--yellow-l);color:var(--yellow-ink);font-size:13px;font-weight:500}

/* app shell */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;overflow-y:auto}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:999px;color:var(--fg2);text-decoration:none;font-weight:500;transition:background .15s ease}
.nav a:hover{background:var(--bg)}
.nav a[aria-current=page]{background:var(--blue-l);color:var(--blue-ink);font-weight:700}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--line)}
.top .grow{flex:1;min-width:0}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--blue-l);color:var(--blue-ink);display:grid;place-items:center;font-weight:700}
.content{padding:24px;max-width:1100px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.page-h{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.page-h h1{font-size:28px}
.bottom{display:none}
.ai-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.ai-chip.on{background:var(--green-l);color:var(--green-ink);border-color:transparent}
.ai-chip.off{background:var(--yellow-l);color:var(--yellow-ink);border-color:transparent}

/* hero de continuación */
.continue{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;background:linear-gradient(135deg,var(--blue-l),var(--surface) 70%)}
.continue h2{font-size:22px}

/* barras semanales */
.bars{display:flex;gap:10px;align-items:flex-end;height:120px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:12px;color:var(--fg2)}
.bar i{display:block;width:100%;max-width:36px;border-radius:8px 8px 4px 4px;background:var(--blue);min-height:4px}
.bar b{color:var(--fg);font-variant-numeric:tabular-nums}

/* lista de sesiones / diario */
.datehead{display:flex;align-items:baseline;gap:12px;margin:12px 0 4px}
.datehead h2{font-size:18px;text-transform:capitalize}
.sess{display:flex;gap:14px;align-items:center;cursor:pointer;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;transition:transform .15s ease,box-shadow .15s ease}
.sess:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.dot{width:12px;height:44px;border-radius:6px;flex:none}
.sess .t{min-width:0;flex:1}
.sess .t strong{display:block}
.empty{text-align:center;padding:40px 16px;color:var(--fg2)}

/* libro inteligente */
.book{display:grid;grid-template-columns:200px 1fr;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface);min-height:520px}
.spine{background:var(--blue-l);padding:20px 12px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.spine h3{font-size:13px;color:var(--fg2);text-transform:uppercase;letter-spacing:.06em;padding:0 10px 6px}
.tab{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:12px;border:0;background:transparent;cursor:pointer;font-weight:500;text-align:left;color:var(--fg)}
.tab[aria-selected=true]{background:var(--surface);font-weight:700;box-shadow:var(--shadow)}
.tab .pip{width:10px;height:10px;border-radius:50%;flex:none}
.tab .n{margin-left:auto;font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums}
.page{padding:28px 32px;display:flex;flex-direction:column;gap:16px;min-width:0}
.page h2{font-size:24px}
.editor{min-height:200px;padding:16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);line-height:1.7;font-size:16px}
.editor:focus{outline:none;border-color:var(--blue-ink)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.ai-box{border:1.5px dashed var(--blue);border-radius:14px;padding:16px;background:var(--blue-l)}
.item{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:14px 16px;border-radius:14px;border:1px solid var(--line);flex-wrap:wrap}
.item.red{background:var(--red-l);border-color:transparent}
.item.yellow{background:var(--yellow-l);border-color:transparent}
.item.green{background:var(--green-l);border-color:transparent}
.opts{display:grid;gap:8px}
.opt{min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;font-weight:500}
.opt:hover{border-color:var(--blue-ink)}
.opt.ok{background:var(--green-l);border-color:var(--green);color:var(--green-ink)}
.opt.no{background:var(--red-l);border-color:var(--red);color:var(--red-ink)}

/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal span{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:12px;background:var(--bg);color:var(--fg2);font-variant-numeric:tabular-nums}
.cal .h{background:transparent;aspect-ratio:auto;font-weight:600}
.cal .l1{background:var(--green-l);color:var(--green-ink)}
.cal .l2{background:var(--green);color:#fff;font-weight:700}
.cal .l3{background:#1E7A38;color:#fff;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

dialog{border:0;border-radius:20px;padding:24px;background:var(--surface);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(480px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(32,33,36,.5)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;z-index:50;max-width:calc(100vw - 32px)}
.view{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .hero .art{order:-1;max-width:220px;margin:auto}
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:10px 16px}
  .content{padding:16px 16px 96px}
  .continue{grid-template-columns:1fr}
  .book{grid-template-columns:1fr}
  .spine{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}
  .spine h3{display:none}
  .tab{flex:none}
  .page{padding:20px 16px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));z-index:20}
  .bottom a,.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;font-size:11px;font-weight:600;color:var(--fg2);text-decoration:none;border:0;background:transparent;border-radius:12px;cursor:pointer}
  .bottom a[aria-current=page]{color:var(--blue-ink);background:var(--blue-l)}
  .more{position:fixed;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:30;padding:8px;min-width:200px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="root"></div>
<dialog id="dlg" aria-labelledby="dlg-t"></dialog>

<script>
/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={
 home:'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
 book:'M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z M4 19.5V4.5',
 notes:'M6 3h9l4 4v14H6z M14 3v5h5 M9 13h7 M9 17h7',
 help:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7 M12 17h.01',
 bulb:'M9 18h6 M10 21h4 M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z',
 refresh:'M20 11a8 8 0 0 0-14.5-4.5L4 8 M4 4v4h4 M4 13a8 8 0 0 0 14.5 4.5L20 16 M20 20v-4h-4',
 chart:'M4 20V10 M10 20V4 M16 20v-7 M22 20H2',
 gear:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M12 2v3 M12 19v3 M4.9 4.9 7 7 M17 17l2.1 2.1 M2 12h3 M19 12h3 M4.9 19.1 7 17 M17 7l2.1-2.1',
 plus:'M12 5v14M5 12h14',search:'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z M21 21l-4.3-4.3',
 trash:'M4 7h16 M9 7V4h6v3 M6 7l1 13h10l1-13',edit:'M4 20h4L19 9l-4-4L4 16z',
 check:'M5 12.5l4.5 4.5L19 7',arrow:'M5 12h14M13 6l6 6-6 6',more:'M5 12h.01M12 12h.01M19 12h.01',
 cloud:'M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4.5 4.5 0 0 1 0 9z',
 chip:'M7 7h10v10H7z M9 2v3 M15 2v3 M9 19v3 M15 19v3 M2 9h3 M2 15h3 M19 9h3 M19 15h3',
 wifi:'M2 9a15 15 0 0 1 20 0 M5.5 12.5a10 10 0 0 1 13 0 M9 16a5 5 0 0 1 6 0 M12 20h.01',
 wifioff:'M3 3l18 18 M2 9a15 15 0 0 1 5-3 M16 6a15 15 0 0 1 6 3 M5.5 12.5a10 10 0 0 1 3-2 M15 10.5a10 10 0 0 1 3.5 2 M12 20h.01',
 layers:'M12 3 3 8l9 5 9-5z M3 13l9 5 9-5',back:'M19 12H5M11 18l-6-6 6-6',x:'M6 6l12 12M18 6 6 18'
};
const ic=(n,c='')=>`<svg class="ico ${c}" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const owl=(s=120)=>`<svg class="owl-float" width="${s}" height="${s}" viewBox="0 0 120 120" role="img" aria-label="Mascota de OstrixAi, un búho azul"><path d="M26 40 20 12l28 18z" fill="#4285F4"/><path d="M94 40l6-28-28 18z" fill="#4285F4"/><ellipse cx="60" cy="70" rx="40" ry="42" fill="#4285F4"/><ellipse cx="22" cy="80" rx="9" ry="21" fill="#3367D6"/><ellipse cx="98" cy="80" rx="9" ry="21" fill="#3367D6"/><ellipse cx="60" cy="92" rx="23" ry="17" fill="#E8F0FE"/><path d="M50 88l10 7 10-7M50 95l10 7 10-7" stroke="#34A853" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="43" cy="52" r="17" fill="#fff"/><circle cx="77" cy="52" r="17" fill="#fff"/><circle cx="44" cy="54" r="8" fill="#202124"/><circle cx="76" cy="54" r="8" fill="#202124"/><circle cx="47" cy="51" r="2.6" fill="#fff"/><circle cx="79" cy="51" r="2.6" fill="#fff"/><path d="M53 63h14l-7 12z" fill="#FBBC05"/></svg>`;

/* ============ i18n ============ */
const I18N={
 es:{start:'Comenzar',login:'Ya tengo una cuenta',hero:'Tu conocimiento crece contigo',
  nav_inicio:'Inicio',nav_diario:'Mi diario',nav_apuntes:'Mis apuntes',nav_dudas:'Mis dudas',nav_eureka:'Eureka',nav_repaso:'Mi repaso',nav_progreso:'Mi progreso',nav_configuracion:'Configuración'},
 en:{start:'Get started',login:'I already have an account',hero:'Your knowledge grows with you',
  nav_inicio:'Home',nav_diario:'My journal',nav_apuntes:'My notes',nav_dudas:'My doubts',nav_eureka:'Eureka',nav_repaso:'My review',nav_progreso:'My progress',nav_configuracion:'Settings'}
};
const t=k=>(I18N[S.lang]&&I18N[S.lang][k])||I18N.es[k]||k;

/* ============ datos ficticios de vista previa ============ */
const TODAY='2026-11-16';
const CATALOG=[
 ['mat','Matemática','blue'],['com','Comunicación','red'],['cyt','Ciencia y Tecnología','green'],
 ['cs','Ciencias Sociales','yellow'],['dpcc','Desarrollo Personal, Ciudadanía y Cívica','blue'],
 ['ef','Educación Física','green'],['art','Arte y Cultura','red'],['ing','Inglés como lengua extranjera','yellow'],
 ['rel','Educación Religiosa','blue'],['ept','Educación para el Trabajo','green'],
 ['fis','Física','green'],['qui','Química','green'],['bio','Biología','green']
];
const SCI=['fis','qui','bio'];
const courses=()=>CATALOG.filter(c=>S.sciSep?c[0]!=='cyt':!SCI.includes(c[0]));
const cname=id=>(CATALOG.find(c=>c[0]===id)||[0,'Curso'])[1];
const ccolor=id=>({blue:'var(--blue)',red:'var(--red)',green:'var(--green)',yellow:'var(--yellow)'})[(CATALOG.find(c=>c[0]===id)||[0,0,'blue'])[2]];
let uid=100;

/* ============ estado real de IA y conexión ============ */
const AI={local:'checking'};
async function detectAI(){
  try{
    if(typeof LanguageModel!=='undefined'&&LanguageModel.availability){AI.local=await LanguageModel.availability()}
    else AI.local='unsupported';
  }catch(e){AI.local='unsupported'}
  refreshChips();
}
function aiState(){
  const online=navigator.onLine;
  const local=AI.local==='available';
  return{online,local,
    net:online?'En línea':'Sin conexión',
    ai:local?'IA local disponible':(AI.local==='downloadable'||AI.local==='downloading')?'IA local: se puede descargar':'Modo esencial',
    cloud:S.offlineOnly?'IA en la nube bloqueada por tu elección':(online?'IA en la nube: pendiente de integración':'La IA en la nube necesita conexión')};
}
function chipsHTML(){
  const a=aiState();
  return `<span class="ai-chip ${a.online?'on':'off'}">${ic(a.online?'wifi':'wifioff')}${a.online?'En línea':'Estás estudiando sin conexión'}</span>
  <span class="ai-chip ${a.local?'on':''}">${ic('chip')}${a.ai}</span>`;
}
function refreshChips(){document.querySelectorAll('[data-chips]').forEach(e=>e.innerHTML=chipsHTML());if(S.view==='configuracion')render()}
addEventListener('online',refreshChips);addEventListener('offline',refreshChips);

function diaryList(){
  let list=S.sessions.filter(s=>(S.filter==='all'||s.course===S.filter));
  const qq=S.query.trim().toLowerCase();
  if(qq)list=list.filter(s=>(s.title+' '+cname(s.course)+' '+plain(s.notes)).toLowerCase().includes(qq));
  if(S.date)list=list.filter(s=>s.date===S.date);
  if(!list.length)return `<div class="empty card flat">${ic('book')}<p><strong>No hay sesiones con esos filtros.</strong></p><p class="small">Prueba otra búsqueda o crea una nueva sesión.</p></div>`;

}

function viewRepaso(){
  const l=allRev();const due=dueRev();
  return `<div class="page-h"><h1>Mi repaso</h1><span class="chip green">${due.length} para hoy</span></div>
  <p class="muted">Las fechas de repaso son un ejemplo simple: si aciertas, la pregunta vuelve en 3 días; si fallas, mañana.</p>
  <div class="stack">${l.map(r=>`<a class="item green" style="text-decoration:none;color:inherit" href="#libro-${r.s.id}" data-tab="repaso"><span><strong>${esc(r.q)}</strong><br><span class="small muted">${esc(cname(r.s.course))} · próximo repaso: ${fmtDate(r.next,{day:'numeric',month:'short'})}${r.done===true?' · acertaste':r.done===false?' · para reforzar':''}</span></span>${ic('arrow')}</a>`).join('')||'<div class="empty">No hay preguntas de repaso todavía.</div>'}</div>`;
}

/* ============ progreso ============ */
function viewProgreso(){
  const first=new Date('2026-11-01T00:00:00Z').getUTCDay();const off=(first+6)%7;
  const cells=[];for(let i=0;i<off;i++)cells.push('<span></span>');
  for(let d=1;d<=30;d++){const ds=`2026-11-${String(d).padStart(2,'0')}`;const n=S.sessions.filter(s=>s.date===ds).length;
    cells.push(`<span class="${n>=3?'l3':n==2?'l2':n==1?'l1':''}" title="${n} sesiones" aria-label="${d} de noviembre: ${n} sesiones">${d}</span>`)}
  const dd=allDudas();const rv=allRev();
  const byC=[...new Set(S.sessions.map(s=>s.course))];
  const pend=dd.filter(d=>d.st===0).sort((a,b)=>a.s.date.localeCompare(b.s.date));
  const rec=[];
  if(dueRev().length)rec.push(`Tienes ${dueRev().length} preguntas de repaso para hoy.`);
  if(pend[0])rec.push(`Tu duda pendiente más antigua es de ${cname(pend[0].s.course)}: “${pend[0].t}”`);
  const noEu=byC.filter(c=>!allEureka().some(e=>e.s.course===c));
  if(noEu[0])rec.push(`En ${cname(noEu[0])} todavía no anotaste ningún Eureka.`);
  return `<div class="page-h"><div><h1>Mi progreso</h1><p class="muted">Conteos de lo que registraste, sin porcentajes de dominio.</p></div><span class="demo-tag">Datos ficticios de vista previa</span></div>
  <section class="grid g3">
   <div class="card"><p class="small muted">Sesiones estudiadas</p><p style="font-size:32px;font-family:var(--font-head)">${S.sessions.length}</p></div>
   <div class="card"><p class="small muted">Dudas comprendidas provisionalmente</p><p style="font-size:32px;font-family:var(--font-head);color:var(--green-ink)">${dd.filter(d=>d.st===3).length}</p></div>
   <div class="card"><p class="small muted">Dudas pendientes</p><p style="font-size:32px;font-family:var(--font-head);color:var(--red-ink)">${dd.filter(d=>d.st===0).length}</p></div>
   <div class="card"><p class="small muted">Preguntas de repaso respondidas</p><p style="font-size:32px;font-family:var(--font-head)">${rv.filter(r=>r.done!==null).length} <span class="small muted">de ${rv.length}</span></p></div></section>
  <section class="grid g2"><article class="card stack"><h3>Actividad de noviembre 2026</h3>
   <div class="cal" role="group" aria-label="Calendario de actividad">${['L','M','M','J','V','S','D'].map(x=>`<span class="h">${x}</span>`).join('')}${cells.join('')}</div>
   <p class="small muted">Más oscuro significa más sesiones ese día.</p></article>
   <article class="card stack"><h3>Recomendaciones de estudio</h3>${rec.map(r=>`<div class="item yellow">${esc(r)}</div>`).join('')||'<p class="muted">Sin recomendaciones por ahora.</p>'}</article></section>
  <section class="card"><h3 style="margin-bottom:8px">Evolución por curso</h3><div class="tablewrap"><table class="tbl"><thead><tr><th>Curso</th><th class="n">Sesiones</th><th class="n">Dudas</th><th class="n">Comprendidas</th><th class="n">Eureka</th></tr></thead><tbody>
   ${byC.map(c=>{const ss=S.sessions.filter(s=>s.course===c);const d=ss.flatMap(s=>s.dudas);return `<tr><td>${esc(cname(c))}</td><td class="n">${ss.length}</td><td class="n">${d.length}</td><td class="n">${d.filter(x=>x.st===3).length}</td><td class="n">${ss.reduce((a,s)=>a+s.eureka.length,0)}</td></tr>`}).join('')}</tbody></table></div></section>`;
}

/* ============ configuración ============ */
function viewConfig(){
  const a=aiState();
  return `<div class="page-h"><h1>Configuración</h1></div>
  <section class="card stack"><h3>Tu perfil de estudio</h3>${quNote()}<div class="grid g2">
   <label class="f" for="grade">Grado<select id="grade" data-act="grade">${[1,2,3,4,5].map(g=>`<option value="${g}" ${S.grade==g?'selected':''}>${g}.º de secundaria</option>`).join('')}</select></label>
   <label class="f" for="lang2">Idioma<select id="lang2" data-act="lang"><option value="es" ${S.lang==='es'?'selected':''}>Español</option><option value="qu" ${S.lang==='qu'?'selected':''}>Quechua chanka (por validar)</option><option value="en" ${S.lang==='en'?'selected':''}>English</option></select></label></div>
   <label class="row"><input type="checkbox" data-act="sciSep" ${S.sciSep?'checked':''}> Mi colegio enseña Física, Química y Biología como cursos independientes</label></section>
  <section class="card stack"><h3>Inteligencia artificial</h3>
   <div class="item ${a.online?'green':'yellow'}"><span>${ic(a.online?'wifi':'wifioff')} <strong>Conexión:</strong> ${a.net}</span></div>
   <div class="item ${a.local?'green':''}"><span>${ic('chip')} <strong>IA local (Gemini Nano):</strong> ${a.local?'disponible en este dispositivo':AI.local==='checking'?'comprobando…':'no disponible aquí; se usa el modo esencial'}</span></div>
   <div class="item"><span>${ic('cloud')} <strong>IA en la nube:</strong> ${a.cloud}</span></div>
   <label class="row"><input type="checkbox" data-act="offlineOnly" ${S.offlineOnly?'checked':''}> Trabajar solo sin conexión (nunca llamar a la nube)</label></section>
  <section class="card stack"><h3>Tus datos</h3><p class="muted">En esta vista previa los cambios viven solo en la memoria de la página. En la aplicación Angular se guardan en IndexedDB, en este dispositivo.</p></section>`;
}

/* ============ libro inteligente ============ */
const TABS=[['apuntes','Apuntes','notes','var(--blue)'],['resumen','Resumen','layers','var(--blue)'],['dudas','Dudas','help','var(--red)'],['eureka','Eureka','bulb','var(--yellow)'],['repaso','Repaso','refresh','var(--green)']];
function viewLibro(){
  const s=sess(S.bookId);if(!s)return `<div class="empty card">No encontramos esa sesión. <a href="#diario">Volver al diario</a></div>`;
  const cnt={dudas:s.dudas.length,eureka:s.eureka.length,repaso:s.rev.length};
  return `<div class="page-h"><a class="btn small ghost" href="#diario">${ic('back')}Mi diario</a><div class="row"><button class="btn small" data-act="editsess" data-id="${s.id}">${ic('edit')}Editar</button><button class="btn small danger" data-act="delsess" data-id="${s.id}">${ic('trash')}Eliminar</button></div></div>
  <div class="book"><div class="spine" role="tablist" aria-label="Secciones del libro"><h3>${esc(s.title)}</h3>
   ${TABS.map(([k,n,i,c])=>`<button class="tab" role="tab" id="t-${k}" aria-selected="${S.tab===k}" data-act="tab" data-id="${k}"><span class="pip" style="background:${c}"></span>${n}<span class="n">${cnt[k]??''}</span></button>`).join('')}</div>
   <div class="page" role="tabpanel" aria-labelledby="t-${S.tab}" id="bookpage">${bookPage(s)}</div></div>`;
}
function bookPage(s){
  const head=`<div class="row"><span class="chip">${esc(cname(s.course))}</span><span class="muted small">${fmtDate(s.date)}</span></div>`;
  if(S.tab==='apuntes')return `${head}<h2>${esc(s.title)}</h2>
   <div class="tools"><button class="btn small" data-act="fmt" data-id="bold" aria-label="Negrita"><b>N</b></button><button class="btn small" data-act="fmt" data-id="italic" aria-label="Cursiva"><i>C</i></button><button class="btn small" data-act="fmt" data-id="insertUnorderedList">Lista</button></div>
   <div class="editor" id="ed" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Apuntes de ${esc(s.title)}">${s.notes}</div>
   <div class="row between"><span class="small muted" id="savest">${ic('check')} Guardado en esta vista previa</span><button class="btn primary" data-act="summ">Generar resumen</button></div>`;
  if(S.tab==='resumen')return `${head}<h2>Resumen</h2>
   <div><span class="chip gray">Tus apuntes originales</span><p style="margin-top:8px" class="muted">${esc(plain(s.notes))}</p></div>
   ${s.summary?`<div class="ai-box"><span class="chip">${esc(s.summary.src)}</span><ul style="margin:10px 0 0;padding-left:20px">${s.summary.pts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`:`<div class="empty card flat"><p><strong>Todavía no hay resumen.</strong></p><p class="small">Genera uno desde tus apuntes.</p><button class="btn primary" style="margin-top:12px" data-act="summ">Generar resumen</button></div>`}`;
  if(S.tab==='dudas')return `${head}<h2>Dudas</h2>
   <form class="row" data-form="duda" style="flex-wrap:nowrap"><label class="sr" for="nd">Nueva duda</label><input id="nd" type="text" placeholder="¿Qué concepto no entiendes?"><button class="btn primary" type="submit">${ic('plus')}Guardar</button></form>
   <div class="stack">${s.dudas.map(d=>`<div class="item red"><span style="min-width:0"><strong>${esc(d.t)}</strong></span><span class="row"><span class="chip red">${DST[d.st]}</span><button class="btn small" data-act="dnext" data-id="${d.id}">Avanzar estado</button></span></div>`).join('')||'<div class="empty">Aún no guardaste dudas en esta sesión.</div>'}</div>`;
  if(S.tab==='eureka')return `${head}<h2>Eureka</h2>
   <form class="row" data-form="eureka" style="flex-wrap:nowrap"><label class="sr" for="ne">Nuevo descubrimiento</label><input id="ne" type="text" placeholder="¿Qué descubriste?"><button class="btn primary" type="submit">${ic('plus')}Guardar</button></form>
   <div class="stack">${s.eureka.map(e=>`<div class="item yellow"><strong>${esc(e.t)}</strong></div>`).join('')||'<div class="empty">Aún no registraste descubrimientos aquí.</div>'}</div>`;
  return `${head}<h2>Repaso</h2><p class="muted small">Preguntas ligadas a tus dudas y apuntes.</p>
   <div class="stack">${s.rev.map(r=>`<div class="item green" style="display:block"><strong>${esc(r.q)}</strong><div class="opts" style="margin-top:10px">${r.opts.map((o,i)=>`<button class="opt ${r.done!==null?(i===r.ok?'ok':(r.pick===i?'no':'')):''}" data-act="ans" data-id="${r.id}" data-i="${i}" ${r.done!==null?'disabled':''}>${esc(o)}</button>`).join('')}</div>
   <p class="small muted" style="margin-top:8px">${r.done===null?'Próximo repaso: '+fmtDate(r.next,{day:'numeric',month:'short'}):(r.done?'¡Correcto! ':'Aún no. ')+'Volverá el '+fmtDate(r.next,{day:'numeric',month:'long'})}</p></div>`).join('')||'<div class="empty">Esta sesión aún no tiene preguntas de repaso.</div>'}</div>`;
}
/* Resumen básico local: no es IA generativa y se rotula así. */
function summarize(s){
  const txt=plain(s.notes).split(/(?<=[.!?])\s+/).filter(x=>x.length>12);
  return{src:'Resumen básico del modo esencial (sin IA generativa)',pts:txt.slice(0,3)};
}

/* ============ render ============ */
function render(){
  const v=S.view;let html;
  if(v==='bienvenida'||v==='')html=viewBienvenida();
  else if(v==='acceso')html=viewAuth(false);
  else if(v==='registro')html=viewAuth(true);
  else if(v==='perfil')html=viewPerfil();
  else{
    const m={inicio:viewInicio,diario:viewDiario,apuntes:viewApuntes,dudas:viewDudas,eureka:viewEureka,repaso:viewRepaso,progreso:viewProgreso,configuracion:viewConfig,libro:viewLibro};
    html=shell((m[v]||viewInicio)());
  }
  $('#root').innerHTML=html;
  document.title='OstrixAi';
}
function toast(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function dlg(html){const d=$('#dlg');d.innerHTML=html;d.showModal()}

/* ============ eventos ============ */
document.addEventListener('click',e=>{
  const tabLink=e.target.closest('[data-tab]');
  if(tabLink)S.tab=tabLink.dataset.tab;
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='more'){S.moreOpen=!S.moreOpen;render()}
  else if(a==='tab'){S.tab=id;render();$('#t-'+id)?.focus()}
  else if(a==='fmt'){document.execCommand(id);$('#ed')?.focus()}
  else if(a==='summ'){const s=sess(S.bookId);syncNotes();s.summary=summarize(s);S.tab='resumen';render();toast('Resumen creado en modo esencial')}
  else if(a==='dnext'){const d=sess(S.bookId).dudas.find(x=>x.id===id);d.st=(d.st+1)%4;render()}
  else if(a==='ans'){const r=sess(S.bookId).rev.find(x=>x.id===id);r.pick=+b.dataset.i;r.done=r.pick===r.ok;r.next=addDays(TODAY,r.done?3:1);render()}
  else if(a==='newsess'||a==='editsess')sessDialog(a==='editsess'?sess(id):null);
  else if(a==='delsess'){dlg(`<h2 id="dlg-t" style="font-size:20px">¿Eliminar esta sesión?</h2><p class="muted" style="margin:10px 0 20px">Se borrarán sus apuntes, dudas, Eureka y repasos. Esta acción no se puede deshacer.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-close>Cancelar</button><button class="btn danger" data-confirm="${id}">Eliminar</button></div>`)}
  if(e.target.closest('[data-close]'))$('#dlg').close();
  const c=e.target.closest('[data-confirm]');
  if(c){S.sessions=S.sessions.filter(s=>s.id!==c.dataset.confirm);$('#dlg').close();toast('Sesión eliminada');go('diario')}
});
function syncNotes(){const ed=$('#ed');if(ed&&S.bookId){sess(S.bookId).notes=ed.innerHTML}}
function sessDialog(s){
  dlg(`<form id="sf" class="stack" data-id="${s?s.id:''}"><h2 id="dlg-t" style="font-size:20px">${s?'Editar sesión':'Nueva sesión'}</h2>
   <label class="f" for="sc">Asignatura<select id="sc">${courses().map(c=>`<option value="${c[0]}" ${s&&s.course===c[0]?'selected':''}>${esc(c[1])}</option>`).join('')}</select></label>
   <label class="f" for="st">Tema de la sesión<input id="st" type="text" value="${s?esc(s.title):''}" required></label>
   <label class="f" for="sd">Fecha<input id="sd" type="date" value="${s?s.date:TODAY}"></label><div class="err" id="se"></div>
   <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>`);
}
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='authform'){
    const reg=f.dataset.reg==='1';const u=f.u.value.trim(),p=f.p.value,p2=reg?f.p2.value:'';
    const err={};
    if(u.length<3)err.u='Escribe un nombre de usuario de al menos 3 caracteres.';
    if(p.length<8)err.p='La contraseña debe tener al menos 8 caracteres.';
    if(reg&&p2!==p)err.p2='Las contraseñas no coinciden.';
    S.auth={err,msg:''};
    if(!Object.keys(err).length)S.auth.msg='El servicio de autenticación aún no está conectado en esta vista previa, así que no se creó ni se verificó ninguna cuenta. En la aplicación real, este formulario llama a AuthService.';
    render();
  }
  else if(f.id==='sf'){
    const title=$('#st').value.trim();if(!title){$('#se').textContent='Escribe el tema de la sesión.';return}
    const course=$('#sc').value,date=$('#sd').value||TODAY;
    if(f.dataset.id){const s=sess(f.dataset.id);Object.assign(s,{title,course,date})}
    else{const id='n'+(uid++);S.sessions.push({id,date,course,title,notes:'<p></p>',summary:null,dudas:[],eureka:[],rev:[]})}
    S.sessions.sort((a,b)=>b.date.localeCompare(a.date));
    $('#dlg').close();toast('Sesión guardada');render();
  }
  else if(f.dataset.form){
    const inp=f.querySelector('input');const v=inp.value.trim();if(!v)return;
    const s=sess(S.bookId);
    if(f.dataset.form==='duda')s.dudas.push({id:'d'+(uid++),t:v,st:0});else s.eureka.push({id:'e'+(uid++),t:v});
    render();
  }
});
document.addEventListener('input',e=>{
  const a=e.target.dataset.act;
  if(a==='query'){S.query=e.target.value;$('#dlist').innerHTML=diaryList()}
  else if(a==='query2'){S.query=e.target.value;render();const i=$('#q');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
  else if(e.target.id==='ed'){
    $('#savest').textContent='Guardando…';clearTimeout(input.t);
    input.t=setTimeout(()=>{syncNotes();const el=$('#savest');if(el)el.innerHTML=ic('check')+' Guardado en esta vista previa'},500);
  }
});
function input(){}
document.addEventListener('change',e=>{
  const a=e.target.dataset.act;if(!a)return;
  if(a==='filter'){S.filter=e.target.value;$('#dlist').innerHTML=diaryList()}
  else if(a==='date'){S.date=e.target.value;$('#dlist').innerHTML=diaryList()}
  else if(a==='lang'){S.lang=e.target.value;render()}
  else if(a==='grade')S.grade=e.target.value;
  else if(a==='sci'){S.sciSep=e.target.value==='1'}
  else if(a==='sciSep'){S.sciSep=e.target.checked}
  else if(a==='offlineOnly'){S.offlineOnly=e.target.checked;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.moreOpen){S.moreOpen=false;render()}});

detectAI();route();
</script>

</body></html>
